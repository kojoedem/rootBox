<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Malware & Virus Repository{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/tailwind.min.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col font-sans">
    <nav class="bg-gray-800 border-b border-gray-700 py-4 px-6 shadow-md">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="/" class="text-xl font-bold tracking-wider text-red-500 flex items-center space-x-2">
                <svg class="w-6 h-6 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
                <span>MALWARE VAULT</span>
            </a>
            <div class="space-x-4">
                <a href="/" class="hover:text-red-400 px-3 py-2 rounded-md text-sm font-medium transition">Dashboard</a>
                <a href="/upload" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-md text-sm font-medium shadow transition">Upload Sample</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl w-full mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-800 border-t border-gray-700 py-4 text-center text-gray-400 text-sm">
        Isolated Secure Malware Laboratory Vault &copy; 2025 - Safe Containment Protocol Active
    </footer>
</body>
</html>
