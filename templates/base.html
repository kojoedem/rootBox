<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}rootBox - Malware & Virus Repository{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/tailwind.min.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col font-sans">
    <nav class="bg-gray-800 border-b border-gray-700 py-4 px-6 shadow-md">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="/" class="flex items-center space-x-3">
                <div class="bg-red-600 text-white font-black px-2.5 py-1 rounded tracking-wider text-xl font-mono shadow">
                    rootBox
                </div>
                <div class="hidden sm:flex flex-col">
                    <span class="text-xs font-mono text-red-400 tracking-widest uppercase">{your secure farm}</span>
                </div>
            </a>
            <div class="space-x-4">
                <a href="/" class="hover:text-red-400 px-3 py-2 rounded-md text-sm font-medium transition">Dashboard</a>
                <a href="/upload" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-md text-sm font-medium shadow transition">Upload Sample</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl w-full mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-800 border-t border-gray-700 py-4 text-center text-gray-400 text-sm">
        rootBox &bull; {your secure farm} &copy; 2025 - Safe Containment Protocol Active
    </footer>
</body>
</html>
